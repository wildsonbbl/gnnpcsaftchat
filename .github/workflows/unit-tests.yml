name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "!hooks/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Download datasets from HuggingFace
        run: |
          git clone https://huggingface.co/wildsonbbl/gnnepcsaft  hfdata
          cp -R hfdata/_data ./chat
      - name: Install dependencies
        run: uv pip install -r requirements.txt
      - name: Analysing the code with pylint
        run: |
          pylint $(git ls-files '*.py') --load-plugins pylint_django \
          --django-settings-module=app.settings --rcfile=.pylintrc
      - name: Unit tests
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python manage.py test chat
