<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="In this app, you can chat with LLM models (Gemini or Ollama) with GNNPCSAFT tools, allowing you to ask questions about the PC-SAFT parameters of various compounds, predict thermodynamic properties, and get insights into the GNNPCSAFT's performance."
    />
    <meta
      name="keywords"
      content="HTML, Django, CSS, GNNPCSAFT, LLM, Chat, Gemini, Ollama"
    />
    <meta name="author" content="Wildson B B Lima" />
    <link href="bootstrap/bootstrap.min.css" rel="stylesheet" />

    <title>GNNPCSAFT Chat</title>
  </head>
  <body class="mt-0 bg-light">
    <div class="container-fluid text-dark">
      <div class="position-relative vh-100">
        <div class="position-absolute top-50 start-50 translate-middle">
          <div
            class="spinner-grow"
            role="status"
            style="width: 6rem; height: 6rem"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
    <script src="bootstrap/bootstrap.bundle.min.js"></script>
  </body>
</html>
